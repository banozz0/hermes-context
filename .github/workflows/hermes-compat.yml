# Nightly: the Python suite and the discovery probe against Hermes main and the latest Hermes release.
# A break opens one hermes-compat issue per slot, or comments on it when the Hermes commit or the failures
# changed; a pass closes it. The checks never fail the run, so the issue is the one alarm, and the run goes red
# only when the report itself fails.
name: Hermes compat

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      hermes_ref:
        description: Hermes branch, tag or commit for the main slot (empty means main)
        default: ""

permissions:
  contents: read
  issues: write

concurrency:
  group: hermes-compat

defaults:
  run:
    shell: bash

jobs:
  compat:
    name: Hermes ${{ matrix.slot }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        slot: [main, release]
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false

      - name: Clone Hermes
        id: clone
        continue-on-error: true
        env:
          SLOT: ${{ matrix.slot }}
          PINNED: ${{ inputs.hermes_ref }}
        run: |
          if [ "$SLOT" = release ]; then
            ref=$(gh release view --repo NousResearch/hermes-agent --json tagName --jq .tagName)
          else
            ref=${PINNED:-main}
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          git init -q "$RUNNER_TEMP/hermes"
          cd "$RUNNER_TEMP/hermes"
          git fetch -q --depth 1 https://github.com/NousResearch/hermes-agent.git "$ref"
          git checkout -q FETCH_HEAD
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # uv takes the Python from the ref's own .python-version: 3.14 on main, 3.11 on v2026.9.24.
      - name: Install Hermes
        id: install
        if: steps.clone.outcome == 'success'
        continue-on-error: true
        working-directory: ${{ runner.temp }}/hermes
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/venv
        run: uv sync --locked --no-dev

      - name: Python suite
        id: suite
        if: steps.install.outcome == 'success'
        continue-on-error: true
        env:
          HERMES_AGENT_SOURCE: ${{ runner.temp }}/hermes
          HERMES_HOME: ${{ runner.temp }}/hermes-home
        run: |
          uv run --no-project --with pytest --with jsonschema --python "$RUNNER_TEMP/venv/bin/python" \
            python -m pytest -p no:cacheprovider -rfE | tee "$RUNNER_TEMP/pytest.log"

      - name: Discovery probe
        id: probe
        if: steps.install.outcome == 'success'
        continue-on-error: true
        env:
          HERMES_AGENT_SOURCE: ${{ runner.temp }}/hermes
          HERMES_HOME: ${{ runner.temp }}/hermes-home
        run: |
          "$RUNNER_TEMP/venv/bin/python" tests/probe_plugin_discovery.py

      - name: Report
        if: ${{ !cancelled() }}
        env:
          TITLE: "Hermes compat: ${{ matrix.slot }} fails"
          SLOT: ${{ matrix.slot }}
          REF: ${{ steps.clone.outputs.ref }}
          COMMIT: ${{ steps.clone.outputs.commit }}
          CLONE: ${{ steps.clone.outcome }}
          INSTALL: ${{ steps.install.outcome }}
          SUITE: ${{ steps.suite.outcome }}
          PROBE: ${{ steps.probe.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          number=$(gh issue list --label hermes-compat --state open --json number,title \
            --jq '.[] | select(.title == env.TITLE) | .number' | head -1)
          failed=""
          for step in "Clone Hermes:$CLONE" "Install Hermes:$INSTALL" "Python suite:$SUITE" "Discovery probe:$PROBE"; do
            if [ "${step#*:}" = failure ]; then failed="$failed${failed:+, }${step%%:*}"; fi
          done
          if [ -z "$failed" ]; then
            if [ -n "$number" ]; then
              gh issue close "$number" --comment "Passes again on Hermes \`$REF\` at NousResearch/hermes-agent@$COMMIT. $RUN_URL"
            fi
            exit 0
          fi
          tests=""
          if [ "$SUITE" = failure ]; then
            # shellcheck disable=SC2016 # the backticks are Markdown, not a command
            tests=$(grep -E '^(FAILED|ERROR) ' "$RUNNER_TEMP/pytest.log" | sed -E 's/^(FAILED|ERROR) ([^ ]+).*/- `\2`/' || true)
          fi
          if [ -n "$tests" ]; then tests=$'\n\nFailing tests:\n'"$tests"; fi
          marker="<!-- hermes-compat $COMMIT $(printf '%s%s' "$failed" "$tests" | sha256sum | cut -c1-12) -->"
          body="Hermes Context fails against Hermes $SLOT: \`${REF:-unresolved}\` at NousResearch/hermes-agent@${COMMIT:-unknown}.

          Failed: $failed$tests

          Run: $RUN_URL

          $marker"
          if [ -z "$number" ]; then
            gh label create hermes-compat --color B60205 --description "Hermes Context breaks against a Hermes ref" --force
            gh issue create --title "$TITLE" --label hermes-compat --body "$body"
          elif ! gh issue view "$number" --json body,comments \
            --jq '[.body, .comments[].body] | map(strings | select(contains("<!-- hermes-compat "))) | last' | grep -qF "$marker"; then
            gh issue comment "$number" --body "$body"
          fi
